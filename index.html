<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartCity Connect</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to right, #f4f6f9, #eef2f3);
        }

        /* NAVBAR */
        nav {
            background: #2e8b57;
            padding: 10px 0;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        nav a {
            color: white;
            margin: 0 22px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* MAIN CARD */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
        }

        .card {
            background: white;
            padding: 40px;
            max-width: 650px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .card h1 {
            margin-top: 0;
            font-size: 32px;
        }

        .card p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        .sdg {
            font-weight: bold;
            color: #2e8b57;
        }

        /* BUTTONS */
        .actions {
            margin-top: 30px;
        }

        .actions button {
            background: #2e8b57;
            color: white;
            border: none;
            padding: 14px 28px;
            margin: 10px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .actions button:hover {
            background: #256f46;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="report.html">Report Issue</a>
    <a href="admin.html">Municipal Dashboard</a>
</nav>

<div class="container">
    <div class="card">
        <h1>SmartCity Connect</h1>

        <p>
            A digital initiative supporting
            <span class="sdg">SDG 11 – Sustainable Cities and Communities</span>.
        </p>

        <p>
            This platform enables citizens to report urban issues
            and helps municipal authorities respond efficiently
            using an Agile-based digital approach.
        </p>

        <div class="actions">
            <button onclick="location.href='report.html'">
                Report a City Issue
            </button>

            <button onclick="location.href='admin.html'">
                Municipal Dashboard
            </button>
        </div>
    </div>
</div>

</body>
</html>
