<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Issue – SmartCity Connect</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to right, #f4f6f9, #eef2f3);
        }

        nav {
            background: #2e8b57;
            padding: 10px 0;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        nav a {
            color: white;
            margin: 0 22px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
        }

        .card {
            background: white;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        select, textarea, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #2e8b57;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #256f46;
        }

        .success {
            margin-top: 20px;
            color: green;
            font-weight: 600;
        }

        .status-box {
            margin-top: 15px;
            background: #eef3f7;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="report.html">Report Issue</a>
    <a href="admin.html">Admin Dashboard</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Report a City Issue</h2>

        <select id="issueType">
            <option value="">Select Issue Type</option>
            <option>Garbage Overflow</option>
            <option>Pothole</option>
            <option>Streetlight Issue</option>
            <option>Water Leakage</option>
        </select>

        <textarea id="description" placeholder="Describe the issue"></textarea>

        <button onclick="submitComplaint()">Submit Complaint</button>

        <div id="output"></div>
    </div>
</div>

<script>
function submitComplaint() {
    const issue = document.getElementById("issueType").value;
    const desc = document.getElementById("description").value;
    const output = document.getElementById("output");

    if(issue === "" || desc.trim() === "") {
        output.innerHTML = "<p style='color:red'>Please fill all fields.</p>";
        return;
    }

    const id = "SC-" + Math.floor(Math.random() * 10000);

    localStorage.setItem(id, JSON.stringify({
        issue: issue,
        description: desc,
        status: "Pending Review"
    }));

    output.innerHTML =
        "<div class='success'>Complaint submitted successfully!</div>" +
        "<div class='status-box'><b>Complaint ID:</b> " + id +
        "<br><b>Status:</b> Pending Review</div>";

    document.getElementById("issueType").value = "";
    document.getElementById("description").value = "";
}
</script>

</body>
</html>
